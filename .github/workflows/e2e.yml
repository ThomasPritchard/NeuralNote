# Native end-to-end tests drive the real application through WebdriverIO's
# embedded Tauri provider. Ubuntu and macOS are required pull-request gates;
# Windows remains an informational main/manual lane until issue #78 is resolved.

name: e2e-native

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/e2e.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "app/desktop/**"
      - "scripts/**"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  required-native:
    name: Native Tauri (${{ matrix.label }})
    runs-on: ${{ matrix.platform }}
    # Matches the widened per-wait budget in `nativeWait`: this suite passes
    # locally and expired on the hosted macOS runner, and a per-wait budget the
    # job cap outlives is no budget at all.
    timeout-minutes: 30
    # macOS is informational until #100 lands. The suite passes locally, and the
    # runner's 1024x768 display clamps the app's 1280x820 window until the note
    # column is too narrow to render the lines the journeys reach for. Three
    # fixes narrowed it - budgets, first-run picker, document-level scrolling -
    # and the harness records only `errorType`, never the message, so every cause
    # so far has produced byte-identical metadata. Ubuntu stays required and runs
    # the same journeys.
    continue-on-error: ${{ matrix.informational || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            label: Ubuntu
          - platform: macos-latest
            label: macOS (informational)
            informational: true

    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Tauri system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xvfb

      - name: Setup Rust 1.96
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.96.0

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.8.1
        with:
          workspaces: "."

      - name: Setup Node 24 LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/desktop/package-lock.json
            app/desktop/e2e-native/package-lock.json

      - name: Install desktop dependencies
        working-directory: app/desktop
        run: npm ci

      - name: Install native E2E dependencies
        working-directory: app/desktop/e2e-native
        run: npm ci

      - name: Native Tauri E2E (Ubuntu)
        if: runner.os == 'Linux'
        working-directory: app/desktop/e2e-native
        run: xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" npm test

      - name: Native Tauri E2E (macOS)
        if: runner.os == 'macOS'
        working-directory: app/desktop/e2e-native
        run: npm test

      - name: Upload redacted failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-e2e-${{ runner.os }}-${{ github.run_attempt }}
          path: app/desktop/e2e-native/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  windows-informational:
    name: Native Tauri (Windows informational)
    if: github.event_name != 'pull_request'
    continue-on-error: true
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Setup Rust 1.96
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.96.0

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.8.1
        with:
          workspaces: "."

      - name: Setup Node 24 LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/desktop/package-lock.json
            app/desktop/e2e-native/package-lock.json

      - name: Install desktop dependencies
        working-directory: app/desktop
        run: npm ci

      - name: Install native E2E dependencies
        working-directory: app/desktop/e2e-native
        run: npm ci

      - name: Native Tauri E2E
        working-directory: app/desktop/e2e-native
        run: npm test

      - name: Upload redacted failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-e2e-Windows-${{ github.run_attempt }}
          path: app/desktop/e2e-native/artifacts/
          if-no-files-found: ignore
          retention-days: 7
