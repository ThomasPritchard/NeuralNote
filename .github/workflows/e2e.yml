# Native end-to-end tests drive the real application through WebdriverIO's
# embedded Tauri provider. Ubuntu is the required pull-request and main gate.
# macOS and Windows stay informational and run only on the weekly schedule or
# manual dispatch until #100/#101/#78 are settled. macOS still runs strictly
# more journeys than Ubuntu - see `required-native` for which ones only it
# covers. Windows has never produced a pass-rate on this runner; see the
# `windows-informational` job.

name: e2e-native

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/e2e.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "app/desktop/**"
      - "scripts/**"
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: e2e-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  required-native:
    name: Native Tauri (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Tauri system dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xvfb

      - name: Setup Rust 1.96
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.96.0

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.8.1
        with:
          workspaces: "."

      - name: Setup Node 24 LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/desktop/package-lock.json
            app/desktop/e2e-native/package-lock.json

      - name: Install desktop dependencies
        working-directory: app/desktop
        run: npm ci

      - name: Install native E2E dependencies
        working-directory: app/desktop/e2e-native
        run: npm ci

      - name: Native Tauri E2E (Ubuntu)
        working-directory: app/desktop/e2e-native
        run: xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" npm test

      - name: Upload redacted failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-e2e-${{ runner.os }}-${{ github.run_attempt }}
          path: app/desktop/e2e-native/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  macos-informational:
    name: Native Tauri (macOS informational)
    # Parked until #100/#101 land. The suite passes locally; the hosted runner's
    # 1024x768 display clamps the app's 1280x820 window. Ubuntu does not run the
    # same journeys (macOS save accelerator, fullscreen), so this is a real
    # coverage gap, not a duplicate lane.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Setup Rust 1.96
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.96.0

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.8.1
        with:
          workspaces: "."

      - name: Setup Node 24 LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/desktop/package-lock.json
            app/desktop/e2e-native/package-lock.json

      - name: Install desktop dependencies
        working-directory: app/desktop
        run: npm ci

      - name: Install native E2E dependencies
        working-directory: app/desktop/e2e-native
        run: npm ci

      - name: Native Tauri E2E (macOS)
        working-directory: app/desktop/e2e-native
        run: npm test

      - name: Upload redacted failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-e2e-${{ runner.os }}-${{ github.run_attempt }}
          path: app/desktop/e2e-native/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  windows-informational:
    name: Native Tauri (Windows informational)
    # Issue #78 calls this lane "~50% flaky" and blames a WebdriverIO startup
    # race. That framing is stale. The job failed 6/6 of the last runs in about
    # a minute each - far too early to have reached WebdriverIO at all - dying
    # in `npm run test:config`, where two assertions located job headers with
    # `indexOf("  frontend:\n")`. No `.gitattributes` covers `.github/workflows`
    # - the repository's only one sits under `fixtures/note-test-vault/` and
    # applies there alone, so `git check-attr text -- .github/workflows/ci.yml`
    # reports `unspecified` - and Windows therefore checks the workflows out
    # with CRLF, so those lookups returned -1. Fixed by normalising line endings
    # at read time in `app/desktop/e2e-native/ci-workflow.test.ts`.
    #
    # What #78 originally asked is deferred, not answered: a 2026-08-18 `main`
    # run did get past `test:config` and then failed the suite. The lane is
    # parked off pull requests and ordinary `main` pushes because Windows is
    # not a release target for this macOS-only alpha. Weekly and manual runs
    # keep producing the pass-rate data; stabilise or drop from that, not from
    # every merge.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Setup Rust 1.96
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.96.0

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.8.1
        with:
          workspaces: "."

      - name: Setup Node 24 LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/desktop/package-lock.json
            app/desktop/e2e-native/package-lock.json

      - name: Install desktop dependencies
        working-directory: app/desktop
        run: npm ci

      - name: Install native E2E dependencies
        working-directory: app/desktop/e2e-native
        run: npm ci

      - name: Native Tauri E2E
        working-directory: app/desktop/e2e-native
        run: npm test

      - name: Upload redacted failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-e2e-Windows-${{ github.run_attempt }}
          path: app/desktop/e2e-native/artifacts/
          if-no-files-found: ignore
          retention-days: 7
